<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preload" as="image" href="img/aqua_back.jpg">
    
    <style>
         * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background-color: #b9dff1;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background-image: url(img/aqua_back.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }

        .head {
            width: 100%;
            height: auto;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            margin-top: 20%;
        }
        .head img {
            width: 60%;
            height: auto;
            display: block;
            padding-top: 3%;
            padding-bottom: 3%;
        }

        a {
        color: inherit;
        text-decoration: none;
        }

        .btn {
            display: flex;
            flex-direction: column;   /* 세로 일렬 */
            align-items: center;      /* 버튼 가운데 정렬 */
            gap: 20px;
            margin-top: 20%;
        }

        .btn a {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 80%;
            max-width: 200px;
            padding: 18px 20px;

            background-color: #fff;
            border-radius: 10px;

            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);

            font-size: 24px;
            font-weight: 600;
            color: #029cc1;

            transition: 0.2s;
        }

        .btn a:hover,
        .btn a:active {
            background-color: #029cc1;
            color: #fff;
        }

        select {
            font: inherit;
        }
    </style>
</head>
<body>
    <div class="head"><img src="img/aqua_logo.png" alt=""></div>
    

    <div class="btn">
        <a href="./pdf/aqua_kr.pdf" target="_blank">한국어 →</a>
        <a href="./pdf/aqua_en.pdf" target="_blank">English →</a>
        <a href="./pdf/aqua_cn.pdf" target="_blank">中文 →</a>
        <a href="./pdf/aqua_jp.pdf" target="_blank">日本語 →</a>
    </div>
    
</body>
</html>
